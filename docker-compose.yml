services:
  db:
    image: postgres:16
    container_name: backend_ai_postgres
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: backend_ai_redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: backend_ai_app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tasks
      REDIS_URL: redis://redis:6379
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: